[pytest]
# rootdir-relative import: lets `from app...` and `from tests...` resolve
# without a sys.path hack in every test file. No backend/pyproject.toml exists
# yet (Phase 0 hasn't needed one), so pytest.ini is the config surface — if a
# pyproject.toml is added later, fold this into [tool.pytest.ini_options].
testpaths = tests

# unknown-marker warnings fail nothing by default, but they're noise that
# hides a real "did you typo the marker name" mistake. Registering `live`
# also makes `-m "not live"` a real deselect instead of a silent no-op.
markers =
    live: hits the real NVIDIA endpoint. Deselect with -m "not live".

# Explicit over the pytest-asyncio default (which is "strict" pre-0.21 and
# changed across versions) — every `async def test_*` runs as a coroutine
# without needing `@pytest.mark.asyncio` on each one.
asyncio_mode = auto
# pytest-asyncio 0.25 warns (PytestDeprecationWarning) if this is unset,
# since a future release changes the default. Pinned explicitly so behavior
# doesn't shift out from under test_checkpointer.py's thread_id isolation
# check later in the phase.
asyncio_default_fixture_loop_scope = function
